name: build

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: workflows from forks cannot write to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: Self-test
        shell: pwsh
        run: |
          # WinExe does not block the shell, so wait for it to get the exit code.
          $p = Start-Process bin/Release/net10.0-windows10.0.19041.0/MyNotch.exe -ArgumentList --selftest -Wait -PassThru
          Get-Content (Join-Path $env:TEMP mynotch-selftest.txt)
          exit $p.ExitCode
